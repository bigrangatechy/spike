# Spike Stage 1 live menu (BIOS / El Torito via grub2).
# Placeholders LINUX_LIVE / LINUX_INSTALL / MEMTEST are filled by live-build.
# Note: scripts/spike-iso-hybridize.sh rewrites the final USB/ISO grub.cfg with
# the full Spike theme; keep this template readable if hybridize is skipped.
set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
terminal_output gfxterm
if [ -f $prefix/themes/spike/theme.txt ]; then
	set theme=$prefix/themes/spike/theme.txt
	export theme
fi
set color_normal=light-gray/black
set color_highlight=white/black

LINUX_LIVE

LINUX_INSTALL

MEMTEST
