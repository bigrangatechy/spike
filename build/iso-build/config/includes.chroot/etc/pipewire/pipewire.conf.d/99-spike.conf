# Spike live PipeWire defaults (MULTIMEDIA.md).
# Installer/spike-config will regenerate this on installed systems.
# Locked 44100Hz saves CPU on Tier-1 (N4020-class) targets.
context.properties = {
  log.level = 1
  default.clock.rate = 44100
  default.clock.quantum = 1024
  default.clock.min-quantum = 32
  default.clock.max-quantum = 2048
  default.clock.allowed-rates = [ 44100 ]
}
