# Soften transient mirror races (e.g. packages.mozilla.org "unexpected size"
# while CDN syncs). Used on live/installed Spike and during lb chroot apt.
Acquire::Retries "5";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::http::Pipeline-Depth "0";
Acquire::https::Pipeline-Depth "0";
