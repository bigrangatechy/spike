# Spike Qt platform theme (plasma-integration) for KDE apps on live session.
QT_QPA_PLATFORMTHEME=kde
# Dolphin/Kirigami QML controls follow KDE desktop style (not generic Fusion).
QT_QUICK_CONTROLS_STYLE=org.kde.desktop
# Colon list: Spike identity + KDE so xdg-desktop-portal picks kde.portal (UseIn=KDE).
XDG_CURRENT_DESKTOP=Spike:KDE
