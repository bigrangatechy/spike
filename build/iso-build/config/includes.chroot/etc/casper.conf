# Spike live identity (casper). Copied into the initramfs by casper's hook.
# Cmdline username=/hostname= also override — keep both in sync.
# FLAVOUR must be non-empty so .disk/info does not rewrite USERNAME/HOST.
export USERNAME="spike"
export USERFULLNAME="Spike Live"
export HOST="spike-live"
export BUILD_SYSTEM="Spike"
export FLAVOUR="Spike"
