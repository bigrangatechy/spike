# Spike: sof-essx8336 HDMI PCMs (5/6/7) return ASoC -5 and flood the journal.
# Scope to Essx8336 only — do not disable HDMI on unrelated cards.
# Within each match object props are ANDed; match objects are ORed.

monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "~.*[Ee]ssx8336.*"
        node.name = "~.*hdmi.*"
      }
      {
        api.alsa.card.name = "~.*[Ee]ssx8336.*"
        api.alsa.path = "~hdmi:.*"
      }
      {
        api.alsa.card.name = "~.*[Ee]ssx8336.*"
        api.alsa.pcm.device = "5"
      }
      {
        api.alsa.card.name = "~.*[Ee]ssx8336.*"
        api.alsa.pcm.device = "6"
      }
      {
        api.alsa.card.name = "~.*[Ee]ssx8336.*"
        api.alsa.pcm.device = "7"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
