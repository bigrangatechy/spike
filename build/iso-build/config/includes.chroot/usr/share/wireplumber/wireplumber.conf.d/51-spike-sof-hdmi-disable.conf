# Spike: sof-essx8336 HDMI PCMs (5/6/7) return ASoC -5 and flood the journal.
# UCM HiFi no longer includes Hdmi.conf (primary fix). These rules are backup:
# match OR'd properties — do NOT AND with card.name (property often missing → no match).

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~.*[Hh][Dd][Mm][Ii].*" }
      { api.alsa.path = "~hdmi:.*" }
      { media.name = "~.*HDMI.*" }
      { api.alsa.pcm.device = "5" }
      { api.alsa.pcm.device = "6" }
      { api.alsa.pcm.device = "7" }
      { api.alsa.pcm.device = 5 }
      { api.alsa.pcm.device = 6 }
      { api.alsa.pcm.device = 7 }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
