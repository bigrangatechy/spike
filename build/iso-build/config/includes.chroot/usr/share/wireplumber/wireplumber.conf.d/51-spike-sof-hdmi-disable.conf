# Spike: sof-essx8336 HDMI PCMs (5/6/7) return ASoC -5 and flood the journal.
# Disable HDMI sinks/sources early; leave analog speakers alone.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~.*hdmi.*"
      }
      {
        api.alsa.path = "~hdmi:.*"
      }
      {
        api.alsa.pcm.device = "5"
      }
      {
        api.alsa.pcm.device = "6"
      }
      {
        api.alsa.pcm.device = "7"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
