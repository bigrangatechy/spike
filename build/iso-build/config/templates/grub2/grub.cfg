# Fallback template if binary_grub/grub.cfg is not picked up.
# Final USB/ISO menu is written by scripts/spike-iso-hybridize.sh (themed).
set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
terminal_output gfxterm
if [ -f $prefix/themes/spike/theme.txt ]; then
	set theme=$prefix/themes/spike/theme.txt
	export theme
fi
set color_normal=light-gray/black
set color_highlight=white/black

LINUX_LIVE

LINUX_INSTALL

MEMTEST
