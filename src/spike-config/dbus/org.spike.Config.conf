<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Spike config engine — system bus policy (docs/CONFIGURATION.md). -->
<busconfig>
  <policy user="root">
    <allow own="org.spike.Config"/>
  </policy>
  <!-- Settings GUI (user session) may call methods; writes still run as the service user. -->
  <policy context="default">
    <allow send_destination="org.spike.Config"/>
    <allow receive_sender="org.spike.Config"/>
  </policy>
</busconfig>
